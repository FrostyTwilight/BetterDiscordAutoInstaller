name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore BetterDiscordInstaller/BetterDiscordInstaller.csproj

      - name: Build
        run: dotnet build BetterDiscordInstaller/BetterDiscordInstaller.csproj -c Release --no-restore

      - name: Package
        shell: pwsh
        run: |
          $staging = 'release'
          $buildDir = 'BetterDiscordInstaller/bin/Release/net472'
          New-Item -ItemType Directory -Path $staging -Force
          Copy-Item "$buildDir/BetterDiscordInstaller.dll" $staging
          Copy-Item "$buildDir/Update.exe.config" $staging
          Compress-Archive -Path "$staging/*" -DestinationPath BetterDiscordInstaller.zip

      - uses: actions/upload-artifact@v4
        with:
          name: BetterDiscordInstaller
          path: BetterDiscordInstaller.zip

      - uses: softprops/action-gh-release@v2
        with:
          files: BetterDiscordInstaller.zip
